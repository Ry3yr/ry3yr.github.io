<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redirect with Check</title>
<script>
  var url = "https://alceawis.de/index.html";
  var fallbackUrl = "https://ry3yr.github.io/zipfs-sw-worker.html";
  var redirectDelay = 3;
  var time = redirectDelay;

  // --- Referrer check (new) ---
  var X_REDIRECT_TARGET = "https://x.com/ryedai1"; // fixed constant — never derived from input
  var TWITTER_HOSTS = ["x.com", "www.x.com", "twitter.com", "www.twitter.com", "t.co"];

  function isFromTwitter() {
    var ref = document.referrer;
    if (!ref) return false;
    var host;
    try {
      host = new URL(ref).hostname.toLowerCase();
    } catch (e) {
      return false; // malformed referrer
    }
    return TWITTER_HOSTS.indexOf(host) !== -1;
  }

  function shouldSkipXRedirect() {
    // Loop guard: if we were just sent here with ?from=x, don't bounce again
    return /(?:^\?|&)from=x(?:&|$)/.test(window.location.search);
  }

  function checkXReferrer() {
    if (shouldSkipXRedirect()) return false;
    if (!isFromTwitter()) return false;
    window.location.replace(X_REDIRECT_TARGET);
    return true;
  }

  // --- Original behavior (unchanged) ---
  function checkUrlAndRedirect() {
    var img = new Image();
    img.onload = function() {
      startCountdown(url);
    };
    img.onerror = function() {
      showFallbackLink();
    };
    img.src = "https://alceawis.de/other/images/icon/code.png?" + Date.now();
  }

  function startCountdown(redirectUrl) {
    var interval = setInterval(function () {
      var seconds = time;
      if (seconds.toString().length == 1) seconds = "0" + seconds;
      document.getElementById("time").textContent = seconds + " seconds";
      time--;
      if (time < 0) {
        clearInterval(interval);
        window.location.href = redirectUrl;
      }
    }, 1000);
  }

  function showFallbackLink() {
    document.getElementById('timer-container').style.display = 'none';
    var container = document.getElementById('fallback-container');
    container.innerHTML = '<h1><a href="' + fallbackUrl + '">Site not reachable. Click here to go to fallback page.</a></h1>';
  }

  // --- Entry point ---
  window.onload = function () {
    if (checkXReferrer()) return; // matched X/t.co → redirected, stop here
    checkUrlAndRedirect();        // otherwise proceed as usual
  };
</script>
<style>
  /* ... unchanged ... */
</style>
</head>
<body>
  <!-- ... unchanged ... -->
</body>
</html>
