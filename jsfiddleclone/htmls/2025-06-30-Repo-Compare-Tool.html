<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Repo Compare Tool</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background-color: #f9f9f9;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    /* Style for forked repos when checkbox is checked */
    .forked a {
      color: gray !important;
      font-style: italic;
    }
    #log {
      margin-top: 30px;
      padding: 10px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      font-size: 14px;
      max-height: 200px;
      overflow-y: auto;
    }
    #log .log-entry {
      margin-bottom: 5px;
    }
    input { margin-right: 10px; }
    form label { margin-right: 15px; display: inline-block; margin-bottom: 8px; }
    #warnings {
      margin-top: 15px;
    }
    .warning-box {
      background: #fff4e5;
      border: 1px solid #f0b429;
      color: #7a4a00;
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .warning-box strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h2>Compare Public Repos</h2>

  <label><input type="checkbox" id="markForked"> Mark forked repos (grey)</label>
  <label><input type="checkbox" id="fetchAll"> All repos</label>

  <form id="repoForm" style="margin-top: 10px;">
    <label>URL 1: <input type="text" id="user1" value="https://codeberg.org/alceawisteria" required></label>
    <label>URL 2: <input type="text" id="user2" value="https://github.com/Ry3yr" required></label>
    <label>URL 3: <input type="text" id="user3" value="https://gitea.moe/Alcea" required></label>
    <br>
    <details><summary>-</summary><label>CORS Proxy (used for Gitea instances only): <input type="text" id="corsProxy" value="https://alceawis.de/cors.php" style="width: 320px;"></label></details>
    <br>
    <button type="submit">Compare</button>
  </form>

  <div id="warnings"></div>

  <h3 id="sharedHeader">Shared Repositories</h3>
  <table id="sharedReposTable" aria-label="Shared repositories table">
    <thead>
      <tr>
        <th>Repository Name</th> <!-- This will be replaced dynamically -->
      </tr>
    </thead>
    <tbody>
      <!-- Shared repos go here -->
    </tbody>
  </table>

  <h3 id="differentHeader">Different Repositories</h3>
  <table id="differentReposTable" aria-label="Different repositories table">
    <thead>
      <tr>
        <th id="user1Header">User 1 Only</th>
        <th id="user2Header">User 2 Only</th>
        <th id="user3Header">User 3 Only</th>
      </tr>
    </thead>
    <tbody>
      <!-- Different repos go here -->
    </tbody>
  </table>

  <h3>Debug Log</h3>
  <div id="log"></div>

  <script>
    const logDiv = document.getElementById("log");
    const warningsDiv = document.getElementById("warnings");

    function log(msg) {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Returns { type: 'github' | 'codeberg' | 'gitea', base: 'https://host' }
    // github.com and codeberg.org get special-cased (well-known, fixed hosts).
    // Anything else is treated as a generic Gitea instance, using whatever
    // host is present in the given URL as the API base.
    function detectPlatform(input) {
      input = input.trim();
      let host = "";
      let origin = "";
      try {
        const url = input.startsWith("http") ? new URL(input) : new URL(`https://${input}`);
        host = url.host;
        origin = url.origin;
      } catch {
        // Fall through with empty host/origin; will default to github below
      }

      if (host.includes("github.com")) {
        return { type: "github", base: "https://github.com" };
      }
      if (host.includes("codeberg.org")) {
        return { type: "codeberg", base: "https://codeberg.org" };
      }
      if (host) {
        // Generic Gitea instance (e.g. gitea.moe, self-hosted Gitea, etc.)
        return { type: "gitea", base: origin };
      }
      // No host could be parsed (plain username was given) - default to github
      return { type: "github", base: "https://github.com" };
    }

    function extractUsername(input) {
      input = input.trim();
      try {
        if (input.startsWith("http")) {
          const url = new URL(input);
          const pathParts = url.pathname.split("/").filter(Boolean);
          return pathParts[0] || null;
        } else {
          return input;
        }
      } catch {
        return input;
      }
    }

    // Fetch all pages if fetchAll is true, otherwise just one page.
    // Returns { repos, failed, errorMsg } - `failed` is explicit so that a
    // legitimate "this user has 0 repos" is never confused with "the
    // request didn't actually work".
    async function fetchRepos(platformInfo, username, fetchAll = false, corsProxy = "") {
      const { type, base } = platformInfo;
      let repos = [];
      let page = 1;
      const per_page = 100; // max per page for GitHub, Codeberg, and Gitea
      let failed = false;
      let errorMsg = "";

      async function fetchPage(page) {
        let url;
        if (type === "github") {
          url = `https://api.github.com/users/${username}/repos?per_page=${per_page}&page=${page}`;
        } else if (type === "codeberg" || type === "gitea") {
          // Codeberg is itself a Gitea instance, so both use the same API shape
          url = `${base}/api/v1/users/${username}/repos?limit=${per_page}&page=${page}`;
        } else {
          log(`Unknown platform for user ${username}`);
          failed = true;
          errorMsg = "Unknown platform";
          return [];
        }

        // Only Gitea (arbitrary self-hosted instances) needs the proxy;
        // GitHub and Codeberg already send permissive CORS headers.
        const useProxy = type === "gitea" && corsProxy;
        const fetchUrl = useProxy ? `${corsProxy}?query=${encodeURIComponent(url)}` : url;

        if (type === "gitea" && !corsProxy) {
          log(`No CORS proxy configured - attempting direct request to ${url} (will likely fail CORS)`);
        }

        log(`Fetching from ${type} (${base})${useProxy ? " via CORS proxy" : ""}: ${url}`);
        try {
          const res = await fetch(fetchUrl);
          if (!res.ok) {
            log(`Failed to fetch from ${type}: ${res.status} ${res.statusText}`);
            failed = true;
            errorMsg = `HTTP ${res.status} ${res.statusText}`;
            return [];
          }
          const data = await res.json();

          // The PHP proxy returns 200 even when the upstream request failed,
          // reporting failures as { error: "..." } instead.
          if (data && typeof data === "object" && !Array.isArray(data) && data.error) {
            log(`Proxy error fetching from ${type} for ${username}: ${data.error}`);
            failed = true;
            errorMsg = `Proxy error: ${data.error}`;
            return [];
          }
          if (!Array.isArray(data)) {
            log(`Unexpected response from ${type} for ${username}: ${JSON.stringify(data).slice(0, 200)}`);
            failed = true;
            errorMsg = "Unexpected (non-array) response";
            return [];
          }

          log(`Fetched ${data.length} repos from ${type} for ${username}, page ${page}`);
          return data.map(repo => ({ name: repo.name, fork: repo.fork }));
        } catch (err) {
          // This is what a browser-level CORS block looks like: a generic
          // "Failed to fetch" TypeError, indistinguishable from other
          // network failures from JS alone.
          log(`Error fetching from ${type}: ${err.message}`);
          failed = true;
          errorMsg = useProxy
            ? `Network error via proxy: ${err.message}`
            : `Network/CORS error: ${err.message}`;
          return [];
        }
      }

      if (!fetchAll) {
        // Just fetch the first page only
        repos = await fetchPage(1);
      } else {
        // Fetch all pages until empty result
        while (true) {
          const pageRepos = await fetchPage(page);
          if (failed) break;
          if (pageRepos.length === 0) break;
          repos = repos.concat(pageRepos);
          if (pageRepos.length < per_page) break; // Last page reached
          page++;
        }
      }

      return { repos, failed, errorMsg };
    }

    function makeRepoLink(platformInfo, username, repo, markForked) {
      const base = platformInfo.base;
      const cssClass = markForked && repo.fork ? 'forked' : '';
      return `<span class="${cssClass}"><a href="${base}/${username}/${repo.name}" target="_blank" rel="noopener noreferrer">${repo.name}</a></span>`;
    }

    document.getElementById("repoForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      logDiv.innerHTML = ''; // Clear log
      warningsDiv.innerHTML = ''; // Clear old warnings

      const input1 = document.getElementById("user1").value;
      const input2 = document.getElementById("user2").value;
      const input3 = document.getElementById("user3").value;
      const markForked = document.getElementById("markForked").checked;
      const fetchAll = document.getElementById("fetchAll").checked;
      const corsProxy = document.getElementById("corsProxy").value.trim();

      const platform1 = detectPlatform(input1);
      const platform2 = detectPlatform(input2);
      const platform3 = detectPlatform(input3);

      const username1 = extractUsername(input1);
      const username2 = extractUsername(input2);
      const username3 = extractUsername(input3);

      const users = [
        { username: username1, platform: platform1 },
        { username: username2, platform: platform2 },
        { username: username3, platform: platform3 },
      ];

      log(`Starting comparison between "${username1}" (${platform1.type}), "${username2}" (${platform2.type}) and "${username3}" (${platform3.type})`);
      if (fetchAll) log("Fetching ALL repos for each user");

      // Update table headers with usernames
      document.getElementById("sharedHeader").textContent = `Shared Repositories (${username1}, ${username2}, ${username3})`;
      document.getElementById("user1Header").textContent = `Repos only on ${username1}`;
      document.getElementById("user2Header").textContent = `Repos only on ${username2}`;
      document.getElementById("user3Header").textContent = `Repos only on ${username3}`;

      // Update shared repos table header to three columns for all users
      document.querySelector("#sharedReposTable thead tr").innerHTML = `
        <th>${username1}</th><th>${username2}</th><th>${username3}</th>
      `;

      const [result1, result2, result3] = await Promise.all([
        fetchRepos(platform1, username1, fetchAll, corsProxy),
        fetchRepos(platform2, username2, fetchAll, corsProxy),
        fetchRepos(platform3, username3, fetchAll, corsProxy)
      ]);
      const results = [result1, result2, result3];

      // Surface any failures as a visible banner, not just a log line -
      // otherwise a fetch failure looks identical to "this user has 0 repos".
      const failedUsers = users
        .map((u, i) => ({ ...u, errorMsg: results[i].errorMsg, failed: results[i].failed }))
        .filter(u => u.failed);

      if (failedUsers.length > 0) {
        warningsDiv.innerHTML = failedUsers.map(u => `
          <div class="warning-box">
            <strong>Could not fetch repos for ${u.username} (${u.platform.type})</strong>
            ${u.errorMsg}${u.platform.type === "gitea" && !corsProxy
              ? ' — this looks like a Gitea instance without CORS enabled. Set a CORS proxy URL above and re-run.'
              : (u.platform.type === "gitea" ? ' — double check the CORS proxy URL above is correct and reachable, then re-run.' : '')}
            Results below may be incomplete for this user.
          </div>
        `).join('');
      }

      // Convert to maps for easy lookup by name
      const maps = [
        new Map(results[0].repos.map(r => [r.name, r])),
        new Map(results[1].repos.map(r => [r.name, r])),
        new Map(results[2].repos.map(r => [r.name, r])),
      ];

      // Union of all repo names across the three users
      const allNames = new Set();
      maps.forEach(m => m.forEach((_, name) => allNames.add(name)));

      const sharedNames = [];   // present in 2 or more users
      const onlyNames = [[], [], []]; // present in exactly 1 user, bucketed per user index

      allNames.forEach(name => {
        const presentIn = maps.reduce((count, m) => count + (m.has(name) ? 1 : 0), 0);
        if (presentIn >= 2) {
          sharedNames.push(name);
        } else {
          const idx = maps.findIndex(m => m.has(name));
          onlyNames[idx].push(name);
        }
      });
      sharedNames.sort();
      onlyNames.forEach(arr => arr.sort());

      // Populate shared repos table (three columns)
      const sharedTbody = document.querySelector("#sharedReposTable tbody");
      if (sharedNames.length === 0) {
        sharedTbody.innerHTML = `<tr><td colspan="3"><em>No shared repositories.</em></td></tr>`;
      } else {
        sharedTbody.innerHTML = sharedNames
          .map(name => {
            const cells = users.map((u, i) => {
              const repo = maps[i].get(name);
              return repo ? `<td>${makeRepoLink(u.platform, u.username, repo, markForked)}</td>` : `<td></td>`;
            }).join('');
            return `<tr>${cells}</tr>`;
          })
          .join('');
      }

      // Populate different repos table with aligned rows (three columns)
      const differentTbody = document.querySelector("#differentReposTable tbody");
      const maxRows = Math.max(onlyNames[0].length, onlyNames[1].length, onlyNames[2].length);
      let rowsHTML = '';

      for (let i = 0; i < maxRows; i++) {
        const cells = users.map((u, idx) => {
          const name = onlyNames[idx][i];
          return name ? `<td>${makeRepoLink(u.platform, u.username, maps[idx].get(name), markForked)}</td>` : `<td></td>`;
        }).join('');
        rowsHTML += `<tr>${cells}</tr>`;
      }

      if (maxRows === 0) {
        rowsHTML = `<tr><td><em>No unique repositories on any user.</em></td><td></td><td></td></tr>`;
      }

      differentTbody.innerHTML = rowsHTML;

      log(`Comparison complete. Shared: ${sharedNames.length}, ${username1} only: ${onlyNames[0].length}, ${username2} only: ${onlyNames[1].length}, ${username3} only: ${onlyNames[2].length}`);
    });
  </script>
</body>
</html>
