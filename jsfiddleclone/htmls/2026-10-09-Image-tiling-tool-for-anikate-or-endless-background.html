<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tile preview · device viewports</title>
<style>
    * { box-sizing: border-box; }
    body {
        background: #1a1f2e;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; margin: 0; padding: 24px 16px; color: #eef3fc;
    }
    .card {
        background: #0f131c; border-radius: 32px; padding: 28px 32px;
        box-shadow: 0 20px 40px rgba(0,0,0,.6), 0 0 0 1px #2e3749 inset;
        max-width: 1200px; width: fit-content; margin: 0 auto;
    }
    h1 {
        font-weight: 500; font-size: 1.6rem; letter-spacing: -.01em;
        margin: 0 0 1.2rem; color: #cfddf5;
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    h1 span {
        background: #2b3a55; font-size: .85rem; padding: 5px 14px;
        border-radius: 40px; font-weight: 400; color: #a0b8dd;
    }
    .controls {
        display: flex; flex-direction: column; gap: 14px; margin-bottom: 30px;
        background: #1a212f; padding: 16px 24px; border-radius: 24px;
        border: 1px solid #303b4e;
    }
    .control-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
    .control-row-label {
        font-size: .75rem; text-transform: uppercase; letter-spacing: .08em;
        color: #7e93b4; font-weight: 600; min-width: 90px;
    }
    .file-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    input[type="file"] { display: none; }
    .file-label {
        background: #2c3b55; padding: 10px 22px; border-radius: 40px;
        font-weight: 500; font-size: .95rem; color: #d6e5ff; cursor: pointer;
        transition: background .15s, transform .1s;
        box-shadow: 0 4px 10px rgba(0,0,0,.3); border: 1px solid #4f6180;
        display: inline-flex; align-items: center; gap: 8px;
    }
    .file-label:hover { background: #3d5070; border-color: #6a82aa; }
    .file-label:active { transform: scale(.97); }
    .filename {
        font-size: .85rem; color: #90a6c9; max-width: 180px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .size-controls {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        background: #111927; padding: 6px 16px 6px 20px; border-radius: 40px;
        border: 1px solid #2b3a55;
    }
    .size-controls label {
        display: flex; align-items: center; gap: 8px;
        font-size: .9rem; color: #b0c6e5;
    }
    .size-controls input[type="number"] {
        width: 72px; background: #1b2538; border: 1px solid #3d4f6b;
        color: #eef3fc; padding: 8px 10px; border-radius: 30px;
        font-size: .9rem; font-family: inherit; text-align: center; outline: none;
        transition: border .15s, box-shadow .15s;
    }
    .size-controls input[type="number"]:focus {
        border-color: #7196d4; box-shadow: 0 0 0 2px rgba(113,150,212,.3);
    }
    .apply-btn {
        background: #37507a; border: none; color: white; padding: 8px 18px;
        border-radius: 30px; font-size: .85rem; font-weight: 500; cursor: pointer;
        transition: background .15s, transform .1s; border: 1px solid #5872a0;
    }
    .apply-btn:hover { background: #4a6596; }
    .apply-btn:active { transform: scale(.96); }
    .preset-buttons { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .preset-btn {
        background: #1f2b3f; color: #c5d5f0; border: 1px solid #35455f;
        padding: 7px 14px; border-radius: 30px; font-size: .82rem; font-weight: 500;
        cursor: pointer; transition: background .15s, border-color .15s, color .15s;
        font-family: inherit;
    }
    .preset-btn:hover { background: #2b3b55; border-color: #4c6083; }
    .preset-btn.active {
        background: #4a6596; border-color: #7196d4; color: white;
        box-shadow: 0 0 0 2px rgba(113,150,212,.25);
    }
    .preview-row {
        display: flex; flex-wrap: wrap; gap: 40px;
        align-items: flex-start; justify-content: center;
    }
    .box-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .box-label {
        font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
        color: #7e93b4; font-weight: 500; margin-bottom: 4px;
    }
    .tile-box {
        background: #0b0e14; border-radius: 20px;
        box-shadow: 0 0 0 2px #2c3b55, 0 12px 24px -8px rgba(0,0,0,.8);
        overflow: hidden; display: flex; align-items: center; justify-content: center;
        background-image: radial-gradient(circle at 25% 25%, #2a3444 1px, transparent 1px);
        background-size: 16px 16px;
    }
    .tile-box img {
        display: block; image-rendering: crisp-edges; image-rendering: pixelated;
    }

    /* ---- Device viewport simulation ---- */
    .device-stage {
        /* outer stage: fits whatever device size is chosen */
        display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .device-shell {
        background: #0b0e14;
        border-radius: 28px;
        padding: 16px;
        box-shadow: 0 0 0 2px #2c3b55, 0 18px 30px -10px black;
        /* the shell itself will never exceed a fixed max, since inner viewport is scaled */
        max-width: 100%;
    }
    .device-viewport {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        background: #05070b;
        box-shadow: 0 0 0 1px #1a2436 inset;
        /* sizing set inline via style */
    }
    .device-viewport .tiling-grid {
        display: grid; gap: 0; line-height: 0;
        width: fit-content;
    }
    .device-viewport .tiling-grid img {
        display: block; image-rendering: crisp-edges; image-rendering: pixelated;
    }
    .device-meta {
        font-size: .78rem; color: #8ba1c2; text-align: center;
        font-variant-numeric: tabular-nums; line-height: 1.5;
    }
    .device-meta b { color: #c5d5f0; font-weight: 600; }

    .empty-hint {
        color: #5f7292; font-size: 1.2rem; font-weight: 400; text-align: center;
        padding: 40px 20px; background: #0b0e14; border-radius: 24px;
        border: 2px dashed #2e3c54;
    }
    .attribution { margin-top: 20px; font-size: .75rem; color: #46597a; }
</style>
</head>
<body>
<div class="card">
    <h1>✂️ crop & tile preview <span>top-left crop · device viewports</span></h1>

    <div class="controls">
        <div class="control-row">
            <span class="control-row-label">source</span>
            <div class="file-group">
                <label for="fileInput" class="file-label"><span>📁</span> Choose image or GIF</label>
                <input type="file" id="fileInput" accept="image/*,image/gif,image/webp,image/png,image/jpeg">
                <span class="filename" id="fileNameDisplay">no file</span>
            </div>
        </div>

        <div class="control-row">
            <span class="control-row-label">crop size</span>
            <div class="size-controls">
                <label>W <input type="number" id="widthInput" min="8" max="2048" value="128" step="1"></label>
                <label>H <input type="number" id="heightInput" min="8" max="2048" value="128" step="1"></label>
                <button class="apply-btn" id="applySizeBtn">apply</button>
            </div>
            <div class="preset-buttons" id="cropPresets"></div>
        </div>

        <div class="control-row">
            <span class="control-row-label">device</span>
            <div class="preset-buttons" id="devicePresets"></div>
        </div>

        <div class="control-row">
            <span class="control-row-label">custom viewport</span>
            <div class="size-controls">
                <label>W <input type="number" id="previewWidthInput" min="64" max="4096" value="375" step="1"></label>
                <label>H <input type="number" id="previewHeightInput" min="64" max="4096" value="667" step="1"></label>
                <label>DPR <input type="number" id="dprInput" min="1" max="4" value="1" step="0.5"></label>
                <button class="apply-btn" id="applyPreviewSizeBtn">apply</button>
            </div>
        </div>
    </div>

    <div id="previewContainer" class="preview-row"></div>
    <div class="attribution">drag & drop works · params: resx= resy= pvx= pvy= dpr=</div>
</div>

<script>
(function() {
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const applySizeBtn = document.getElementById('applySizeBtn');
    const previewWidthInput = document.getElementById('previewWidthInput');
    const previewHeightInput = document.getElementById('previewHeightInput');
    const dprInput = document.getElementById('dprInput');
    const applyPreviewSizeBtn = document.getElementById('applyPreviewSizeBtn');
    const previewContainer = document.getElementById('previewContainer');
    const cropPresets = document.getElementById('cropPresets');
    const devicePresets = document.getElementById('devicePresets');

    let currentImage = null;
    let currentImageSrc = null;
    let currentImageName = '';
    let boxWidth = 128;
    let boxHeight = 128;

    // viewport in CSS pixels (what the page would render at)
    let previewWidth = 375;
    let previewHeight = 667;
    let previewDpr = 1;
    let activeDeviceKey = 'iphone-se';

    // ---- Real device specs (CSS px + DPR + optional scale for display) ----
    // viewportCSS: how the browser sees the screen in CSS px
    // dpr: physical pixels per CSS pixel
    // displayScale: how much we shrink it to fit in the card (optional; auto-fit if null)
    const DEVICE_PRESETS = [
        { key: 'iphone-se',     label: 'iPhone SE',         w: 375,  h: 667,  dpr: 2   },
        { key: 'iphone-720',    label: 'iPhone (720p)',     w: 375,  h: 667,  dpr: 2   }, // 750x1334 physical ≈ 720p class
        { key: 'iphone-1080',   label: 'iPhone (1080p)',    w: 414,  h: 896,  dpr: 3   }, // 1242x2688 physical
        { key: 'android-360',   label: 'Android (360p)',    w: 360,  h: 800,  dpr: 3   },
        { key: 'ipad-768',      label: 'iPad (768p)',       w: 768,  h: 1024, dpr: 2   },
        { key: 'ipad-pro-1024', label: 'iPad Pro 1024',     w: 1024, h: 1366, dpr: 2   },
        { key: 'android-tab-800', label: 'Android Tab 800', w: 800,  h: 1280, dpr: 2   },
        { key: 'desktop-1080',  label: 'Desktop 1080p',     w: 1920, h: 1080, dpr: 1   },
        { key: 'desktop-1440',  label: 'Desktop 1440p',     w: 2560, h: 1440, dpr: 1   },
        { key: 'switch-1280',   label: 'Switch (handheld)', w: 1280, h: 720,  dpr: 1   },
    ];

    const CROP_PRESETS = [
        { label: '128×128', w: 128, h: 128 },
        { label: '512×512', w: 512, h: 512 },
        { label: '128×64',  w: 128, h: 64  },
        { label: '64×64',   w: 64,  h: 64  },
        { label: '256×256', w: 256, h: 256 },
    ];

    const MAX_DISPLAY = 520; // max width/height of the on-screen simulated device (CSS px)

    // ---- URL params ----
    function getQueryParams() {
        const p = new URLSearchParams(window.location.search);
        return {
            resx: p.get('resx'), resy: p.get('resy'),
            pvx: p.get('pvx'),   pvy: p.get('pvy'),
            dpr: p.get('dpr'),
        };
    }
    function updateUrl() {
        const url = new URL(window.location);
        url.searchParams.set('resx', boxWidth);
        url.searchParams.set('resy', boxHeight);
        url.searchParams.set('pvx', previewWidth);
        url.searchParams.set('pvy', previewHeight);
        url.searchParams.set('dpr', previewDpr);
        window.history.replaceState({}, '', url);
    }
    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

    // ---- Preset buttons ----
    function buildCropPresets() {
        cropPresets.innerHTML = '';
        CROP_PRESETS.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'preset-btn';
            btn.textContent = p.label;
            btn.dataset.w = p.w; btn.dataset.h = p.h;
            if (p.w === boxWidth && p.h === boxHeight) btn.classList.add('active');
            btn.addEventListener('click', () => {
                boxWidth = p.w; boxHeight = p.h;
                widthInput.value = p.w; heightInput.value = p.h;
                updateUrl(); updateCropActiveState();
                if (currentImage) generateTileAndRender(); else renderEmpty();
            });
            cropPresets.appendChild(btn);
        });
    }
    function updateCropActiveState() {
        cropPresets.querySelectorAll('.preset-btn').forEach(b => {
            const w = +b.dataset.w, h = +b.dataset.h;
            b.classList.toggle('active', w === boxWidth && h === boxHeight);
        });
    }

    function buildDevicePresets() {
        devicePresets.innerHTML = '';
        DEVICE_PRESETS.forEach(d => {
            const btn = document.createElement('button');
            btn.className = 'preset-btn' + (d.key === activeDeviceKey ? ' active' : '');
            btn.textContent = d.label;
            btn.dataset.key = d.key;
            btn.addEventListener('click', () => {
                previewWidth = d.w; previewHeight = d.h; previewDpr = d.dpr;
                previewWidthInput.value = d.w;
                previewHeightInput.value = d.h;
                dprInput.value = d.dpr;
                activeDeviceKey = d.key;
                updateUrl(); updateDeviceActiveState();
                if (currentImage) generateTileAndRender(); else renderEmpty();
            });
            devicePresets.appendChild(btn);
        });
    }
    function updateDeviceActiveState() {
        devicePresets.querySelectorAll('.preset-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.key === activeDeviceKey);
        });
    }

    // ---- Inputs ----
    function updateSizeFromInputs() {
        let w = parseInt(widthInput.value, 10);
        let h = parseInt(heightInput.value, 10);
        if (isNaN(w)) w = 128; if (isNaN(h)) h = 128;
        w = clamp(w, 8, 2048); h = clamp(h, 8, 2048);
        widthInput.value = w; heightInput.value = h;
        boxWidth = w; boxHeight = h;
        updateUrl(); updateCropActiveState();
        if (currentImage) generateTileAndRender(); else renderEmpty();
    }
    function updatePreviewSizeFromInputs() {
        let w = parseInt(previewWidthInput.value, 10);
        let h = parseInt(previewHeightInput.value, 10);
        let d = parseFloat(dprInput.value);
        if (isNaN(w)) w = 375; if (isNaN(h)) h = 667; if (isNaN(d)) d = 1;
        w = clamp(w, 64, 4096); h = clamp(h, 64, 4096); d = clamp(d, 1, 4);
        previewWidthInput.value = w; previewHeightInput.value = h; dprInput.value = d;
        previewWidth = w; previewHeight = h; previewDpr = d;
        activeDeviceKey = null;
        updateUrl(); updateDeviceActiveState();
        if (currentImage) generateTileAndRender(); else renderEmpty();
    }

    // ---- Crop ----
    function cropTopLeft(img, w, h) {
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        const sW = Math.min(img.naturalWidth, w);
        const sH = Math.min(img.naturalHeight, h);
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, sW, sH, 0, 0, sW, sH);
        return canvas.toDataURL('image/png');
    }

    // ---- Render ----
    function renderPreviewWithTile(tileUrl) {
        // Tiles needed to *exactly* cover the CSS viewport (no bleed).
        const cols = Math.ceil(previewWidth / boxWidth);
        const rows = Math.ceil(previewHeight / boxHeight);

        // Physical dimensions
        const physW = previewWidth * previewDpr;
        const physH = previewHeight * previewDpr;

        // How much we need to scale down to fit in MAX_DISPLAY (respecting aspect)
        const dispScale = Math.min(MAX_DISPLAY / previewWidth, MAX_DISPLAY / previewHeight, 1);
        const dispW = Math.round(previewWidth * dispScale);
        const dispH = Math.round(previewHeight * dispScale);

        // Build tile cells (CSS px sized)
        const tileCells = [];
        for (let i = 0; i < rows * cols; i++) {
            tileCells.push(`<img src="${tileUrl}" width="${boxWidth}" height="${boxHeight}" alt="">`);
        }

        const html = `
            <div class="box-section">
                <div class="box-label">📦 cropped box · ${boxWidth}×${boxHeight}</div>
                <div class="tile-box" style="width:${boxWidth}px;height:${boxHeight}px;">
                    <img src="${tileUrl}" width="${boxWidth}" height="${boxHeight}" alt="cropped box">
                </div>
            </div>
            <div class="box-section device-stage">
                <div class="box-label">📱 device viewport · ${previewWidth}×${previewHeight} CSS px</div>
                <div class="device-shell">
                    <div class="device-viewport" style="
                        width: ${dispW}px;
                        height: ${dispH}px;
                    ">
                        <div style="
                            width: ${previewWidth}px;
                            height: ${previewHeight}px;
                            transform: scale(${dispScale});
                            transform-origin: top left;
                        ">
                            <div class="tiling-grid" style="
                                grid-template-columns: repeat(${cols}, ${boxWidth}px);
                                grid-template-rows: repeat(${rows}, ${boxHeight}px);
                            ">
                                ${tileCells.join('')}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="device-meta">
                    <b>${previewWidth}×${previewHeight}</b> CSS &nbsp;·&nbsp;
                    <b>${physW}×${physH}</b> physical &nbsp;·&nbsp;
                    DPR <b>${previewDpr}</b><br>
                    tiles fit: <b>${cols}×${rows}</b> (${cols * rows} total)
                    ${dispScale < 1 ? ` · shown at ${Math.round(dispScale * 100)}%` : ''}
                </div>
            </div>
        `;
        previewContainer.innerHTML = html;
    }

    function generateTileAndRender() {
        if (!currentImage) { renderEmpty(); return; }
        if (!currentImage.complete || currentImage.naturalWidth === 0) {
            currentImage.onload = () => {
                const url = cropTopLeft(currentImage, boxWidth, boxHeight);
                renderPreviewWithTile(url);
            };
            return;
        }
        const url = cropTopLeft(currentImage, boxWidth, boxHeight);
        renderPreviewWithTile(url);
    }

    function renderEmpty() {
        previewContainer.innerHTML = `
            <div class="empty-hint" style="width:100%;">
                ⬆️ upload an image or animated GIF to see the top-left crop & device tiling preview
            </div>`;
    }

    // ---- File handling ----
    function handleFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) { alert('Please select an image file.'); return; }
        const reader = new FileReader();
        reader.onload = (e) => {
            currentImageSrc = e.target.result;
            currentImageName = file.name;
            fileNameDisplay.textContent = currentImageName.length > 20
                ? currentImageName.substring(0, 18) + '…' : currentImageName;
            const img = new Image();
            img.onload = () => { currentImage = img; generateTileAndRender(); };
            img.onerror = () => alert('Could not load the image.');
            img.src = currentImageSrc;
        };
        reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', (e) => {
        const f = e.target.files[0]; if (f) handleFile(f);
    });

    // Drag & drop
    const dropZone = document.querySelector('.card');
    ['dragenter','dragover','dragleave','drop'].forEach(ev =>
        dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
    dropZone.addEventListener('drop', e => {
        const f = e.dataTransfer.files[0];
        if (f && f.type.startsWith('image/')) { handleFile(f); fileInput.files = e.dataTransfer.files; }
        else if (f) alert('Please drop an image file.');
        dropZone.style.boxShadow = '0 20px 40px rgba(0,0,0,.6), 0 0 0 1px #2e3749 inset';
    });
    dropZone.addEventListener('dragover', () => {
        dropZone.style.boxShadow = '0 20px 40px rgba(0,0,0,.6), 0 0 0 2px #7196d4 inset';
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.style.boxShadow = '0 20px 40px rgba(0,0,0,.6), 0 0 0 1px #2e3749 inset';
    });

    // Buttons
    applySizeBtn.addEventListener('click', updateSizeFromInputs);
    applyPreviewSizeBtn.addEventListener('click', updatePreviewSizeFromInputs);
    [widthInput, heightInput].forEach(i => i.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); updateSizeFromInputs(); }
    }));
    [previewWidthInput, previewHeightInput, dprInput].forEach(i => i.addEventListener('keypress', e => {
        if (e.key === 'Enter') { e.preventDefault(); updatePreviewSizeFromInputs(); }
    }));

    // ---- Init ----
    (function init() {
        const { resx, resy, pvx, pvy, dpr } = getQueryParams();
        if (resx) { const v = +resx; if (!isNaN(v)) { boxWidth = clamp(v,8,2048); widthInput.value = boxWidth; } }
        if (resy) { const v = +resy; if (!isNaN(v)) { boxHeight = clamp(v,8,2048); heightInput.value = boxHeight; } }
        if (pvx)  { const v = +pvx;  if (!isNaN(v)) { previewWidth  = clamp(v,64,4096); previewWidthInput.value  = previewWidth; } }
        if (pvy)  { const v = +pvy;  if (!isNaN(v)) { previewHeight = clamp(v,64,4096); previewHeightInput.value = previewHeight; } }
        if (dpr)  { const v = +dpr;  if (!isNaN(v)) { previewDpr    = clamp(v,1,4);    dprInput.value = previewDpr; } }

        // If initial size matches a preset, sync device key
        const match = DEVICE_PRESETS.find(d => d.w === previewWidth && d.h === previewHeight && d.dpr === previewDpr);
        activeDeviceKey = match ? match.key : null;

        buildCropPresets();
        buildDevicePresets();
        updateCropActiveState();
        updateDeviceActiveState();
        renderEmpty();
    })();
})();
</script>
</body>
</html>
